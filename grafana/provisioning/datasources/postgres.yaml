apiVersion: 1
datasources:
  - name: BudgetDB
    uid: budget-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
